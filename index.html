<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國防預算配置模擬器 — 2026 台灣防衛韌性體檢</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#0c0f14;
      --panel:#13171f;
      --panel-2:#1a1f2a;
      --line:#2a313e;
      --text:#e7eaf0;
      --muted:#8893a5;
      --accent:#e8b84b;
      --accent-dim:#7a6328;
      --teal:#4fb6a8;
      --warn:#d9624b;
      --good:#6bcb77;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      background: radial-gradient(1200px 600px at 80% -10%, rgba(232,184,75,.06), transparent 60%), var(--ink);
      color:var(--text);
      font-family:'Noto Sans TC',system-ui,sans-serif;
      line-height:1.6;
      padding:32px 18px 64px;
      -webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:760px;margin:0 auto}
    header{
      position:relative;
      border:1px solid var(--line);
      background:linear-gradient(135deg,var(--panel) 0%, var(--panel-2) 100%);
      padding:28px 26px 30px;
      overflow:hidden;
    }
    header::after{
      content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
      background:var(--accent);opacity:.10;transform:rotate(38deg);
    }
    .kicker{ font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:0 0 10px; }
    h1{font-size:clamp(22px,5vw,30px);font-weight:900;margin:0 0 8px;letter-spacing:.01em}
    .sub{color:var(--muted);font-size:14px;margin:0;max-width:46ch}
    .budget{ font-family:'IBM Plex Mono',monospace; margin:22px 0 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap; }
    .budget .num{font-size:30px;font-weight:600;color:var(--text)}
    .budget .lbl{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    .alloc{margin:26px 0}
    .row{ border:1px solid var(--line);background:var(--panel); padding:16px 18px;margin-bottom:12px; }
    .row-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
    .row-name{font-weight:700;font-size:15px}
    .row-name small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
    .row-fig{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap}
    .row-pct{font-size:20px;font-weight:600;color:var(--accent)}
    .row-amt{font-size:12px;color:var(--muted);margin-top:1px}
    input[type=range]{
      -webkit-appearance:none;appearance:none;width:100%;height:4px;margin:16px 0 2px;
      background:var(--line);border-radius:2px;outline:none;cursor:pointer;
    }
    input[type=range]::-webkit-slider-thumb{
      -webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;
      background:var(--accent);border:3px solid var(--ink);box-shadow:0 0 0 1px var(--accent);
    }
    input[type=range]::-moz-range-thumb{
      width:20px;height:20px;border-radius:50%;background:var(--accent);
      border:3px solid var(--ink);box-shadow:0 0 0 1px var(--accent);
    }
    .meter{ font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted); display:flex;justify-content:space-between;align-items:center;margin-top:6px; }
    .meter b{color:var(--good)}
    button{
      font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:15px;cursor:pointer;
      border:1px solid var(--accent);background:var(--accent);color:var(--ink);
      padding:14px 22px;width:100%;letter-spacing:.04em;transition:filter .15s,transform .05s;
    }
    button:hover{filter:brightness(1.08)}
    button:active{transform:translateY(1px)}
    .btn-group { display: flex; gap: 12px; margin-top: 14px; }
    button.ghost{background:transparent;color:var(--accent);width: 40%;}
    button.share{background:var(--teal);border-color:var(--teal);color:var(--ink);width: 60%;}
    #report{display:none;margin-top:14px;border:1px solid var(--line);background:var(--panel)}
    .grade-band{ display:flex;align-items:center;gap:18px;padding:24px 26px;border-bottom:1px solid var(--line); background:linear-gradient(135deg,var(--panel-2),var(--panel)); }
    .grade{font-family:'IBM Plex Mono',monospace;font-size:54px;font-weight:600;line-height:1}
    .grade-meta .t{font-weight:900;font-size:18px}
    .grade-meta .d{color:var(--muted);font-size:13px;margin-top:2px}
    .bars{padding:20px 26px}
    .bar-row{margin-bottom:16px}
    .bar-head{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:6px}
    .bar-head span:first-child{font-weight:500}
    .bar-head small{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
    .bar-head b{font-family:'IBM Plex Mono',monospace;color:var(--text)}
    .track{height:8px;background:var(--ink);border:1px solid var(--line);overflow:hidden}
    .fill{height:100%;width:0;background:var(--teal);transition:width .7s cubic-bezier(.2,.8,.2,1)}
    .verdict{padding:6px 26px 24px;color:var(--muted);font-size:14px}
    .verdict .line{color:var(--text);font-weight:500;margin-bottom:8px}
    .config{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted); border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
    footer{margin-top:28px;color:var(--muted);font-size:12px;line-height:1.7;text-align:center}
    footer .disc{color:#6b7283}
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">Defense Allocation Simulator</p>
    <h1>國防預算配置模擬器</h1>
    <p class="sub">將 2026 國防特別預算分配到三條防衛路線。專精能衝高單項，但唯有均衡才能拉起整體作戰韌性！</p>
    <div class="budget">
      <span class="num" id="totalBudget">5,000</span>
      <span class="lbl">億新台幣 · 可分配總額</span>
    </div>
  </header>

  <div class="alloc" id="alloc"></div>

  <div class="meter" aria-live="polite">
    <span>合計比例</span>
    <span><b id="sumPct">100%</b> · <span id="sumAmt">5,000 億</span></span>
  </div>

  <div style="margin-top:18px">
    <button id="runBtn" type="button">生成防衛韌性體檢</button>
  </div>

  <section id="report" aria-live="polite">
    <div class="grade-band">
      <div class="grade" id="gradeLetter">—</div>
      <div class="grade-meta">
        <div class="t" id="gradeTitle"></div>
        <div class="d" id="gradeIndex"></div>
      </div>
    </div>
    <div class="bars" id="bars"></div>
    <div class="verdict">
      <div class="line" id="verdictLine"></div>
      <div id="verdictBody" style="margin-bottom:12px; color:var(--text);"></div>
      <div id="eggVerdict" style="color:var(--accent); background:rgba(232,184,75,0.08); padding:12px; border-left:3px solid var(--accent); font-size:13px; display:none;"></div>
      <div class="config" id="configLine"></div>
    </div>
    <div class="btn-group" style="padding:0 26px 24px">
      <button class="ghost" id="resetBtn" type="button">重新分配</button>
      <button class="share" id="shareBtn" type="button">📋 複製結果去 Threads/PTT 發文</button>
    </div>
  </section>

  <footer>
    <div>純娛樂模擬 · 參考真實國防議題 · 歡迎分享你的配置</div>
    <div class="disc">計分係數為遊戲化權重，非真實兵推；現實國防需專業評估與跨黨派共識。</div>
  </footer>
</div>

<script>
"use strict";

const TOTAL_BUDGET = 5000;
const CATS = [
  { id:"sub",   name:"潛艦後續艦",    desc:"國造潛艇 · 海域拒止" },
  { id:"drone", name:"本土無人機",    desc:"Drone 國家隊 · 不對稱戰力" },
  { id:"us",    name:"美軍裝備",      desc:"HIMARS / Javelin 等外購" },
];

let alloc = { sub:34, drone:33, us:33 };
let currentShareText = "";

const fmt = n => n.toLocaleString("en-US");
const $ = id => document.getElementById(id);

function buildRows(){
  const host = $("alloc");
  CATS.forEach(c => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="row-top">
        <div class="row-name">${c.name}<small>${c.desc}</small></div>
        <div class="row-fig">
          <div class="row-pct" data-pct="${c.id}">0%</div>
          <div class="row-amt" data-amt="${c.id}">0 億</div>
        </div>
      </div>`;
    const label = document.createElement("label");
    label.className = "sr"; label.htmlFor = "slider-" + c.id; label.textContent = c.name + " 預算占比";
    const input = document.createElement("input");
    input.type = "range"; input.min = "0"; input.max = "100"; input.step = "1";
    input.id = "slider-" + c.id;
    input.value = String(alloc[c.id]);
    input.addEventListener("input", () => onSlide(c.id, parseInt(input.value, 10)));
    row.append(label, input);
    host.appendChild(row);
  });
}

function onSlide(changedId, newVal){
  newVal = Math.max(0, Math.min(100, newVal));
  const others = CATS.map(c => c.id).filter(id => id !== changedId);
  const remainder = 100 - newVal;
  const oldOthersSum = others.reduce((s,id) => s + alloc[id], 0);

  if (oldOthersSum > 0){
    let acc = 0;
    others.forEach((id, i) => {
      if (i === others.length - 1){
        alloc[id] = remainder - acc;
      } else {
        const v = Math.round(alloc[id] / oldOthersSum * remainder);
        alloc[id] = v; acc += v;
      }
    });
  } else {
    alloc[others[0]] = Math.floor(remainder / 2);
    alloc[others[1]] = remainder - alloc[others[0]];
  }
  alloc[changedId] = newVal;
  render();
}

function render(){
  CATS.forEach(c => {
    const pct = alloc[c.id];
    const slider = $("slider-" + c.id);
    if (parseInt(slider.value,10) !== pct) slider.value = String(pct);
    document.querySelector(`[data-pct="${c.id}"]`).textContent = pct + "%";
    document.querySelector(`[data-amt="${c.id}"]`).textContent = fmt(Math.round(TOTAL_BUDGET * pct / 100)) + " 億";
  });
  const sum = alloc.sub + alloc.drone + alloc.us;
  $("sumPct").textContent = sum + "%";
  $("sumAmt").textContent = fmt(Math.round(TOTAL_BUDGET * sum / 100)) + " 億";
}

function runReport(){
  const { sub, drone, us } = alloc;
  const cap = v => Math.max(0, Math.min(99, Math.round(v)));

  const sea  = cap(sub*1.3 + us*0.4 + drone*0.2);
  const air  = cap(us*1.3  + drone*0.5 + sub*0.2);
  const asym = cap(drone*1.4 + us*0.5 + sub*0.2);

  const mean = 100/3;
  const variance = ((sub-mean)**2 + (drone-mean)**2 + (us-mean)**2) / 3;
  const sd = Math.sqrt(variance);
  const sustain = Math.max(15, Math.round(100 - sd * 1.8));

  const overall = Math.round((sea + air + asym + sustain) / 4);
  
  // 評級區分
  let gr = { g:"C", t:"火力失衡", d:"過度集中單一路線，持續作戰韌性偏低", c:"var(--warn)" };
  if (overall >= 75) gr = { g:"S", t:"均衡豪豬防線", d:"配置極其精妙，成功建立高生存率的不對稱防線！", c:"var(--good)" };
  else if (overall >= 60) gr = { g:"A", t:"穩健守備陣型", d:"主軸清楚，整體可用，再均衡一點能更耐打。", c:"var(--teal)" };
  else if (overall >= 48) gr = { g:"B", t:"偏科不對稱", d:"單項突出的刺蝟陣型，但被針對缺口時較脆弱。", c:"var(--accent)" };

  $("gradeLetter").textContent = gr.g;
  $("gradeLetter").style.color = gr.c;
  $("gradeTitle").textContent = gr.t;
  $("gradeIndex").textContent = gr.d + "（綜合指數 " + overall + "/100）";

  const dims = [
    { name:"海域拒止力", note:"潛艦主導", v:sea },
    { name:"空中與縱深打擊", note:"外購重裝主導", v:air },
    { name:"不對稱生存力", note:"無人機主導", v:asym },
    { name:"持續作戰韌性", note:"獎勵均衡配置", v:sustain },
  ];
  
  const bars = $("bars");
  bars.innerHTML = "";
  dims.forEach(d => {
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `
      <div class="bar-head"><span>${d.name}<small>${d.note}</small></span><b>${d.v}</b></div>
      <div class="track"><div class="fill"></div></div>`;
    bars.appendChild(row);
    requestAnimationFrame(() => { row.querySelector(".fill").style.width = d.v + "%"; });
  });

  const top = [...dims].sort((a,b)=>b.v-a.v)[0];
  const low = [...dims].sort((a,b)=>a.v-b.v)[0];
  $("verdictLine").textContent = `最強優勢：${top.name}（${top.v}）／防衛漏洞：${low.name}（${low.v}）`;
  
  $("verdictBody").textContent = overall >= 75
    ? "你的配置非常接近黃金均衡，在面對高強度、多面向的灰色地帶衝突與全面封鎖時，是最難被單點突破的陣型。"
    : "過度傾斜單一路線雖能衝高特定分數，但會嚴重拉低作戰韌性。試著修正落後環節再測一次。";

  // 💡 社群爆點：幽默政戰彩蛋系統
  const egg = $("eggVerdict");
  egg.style.display = "none";
  if (drone >= 70) {
    egg.innerHTML = "🛸 <b>【極端無人機海流】</b>：你造了密密麻麻的無人機！但因預算排擠，這批商規機種缺乏高級抗干擾與抗風能力。秋冬海峽強風一吹就掉，敵軍電戰槍一開整批被劫，Threads 脆友正在趕來的路上……";
    egg.style.display = "block";
  } else if (sub >= 65) {
    egg.innerHTML = "🔱 <b>【大潛艦大艦隊主義】</b>：海域控制拒止力爆表！但由於後續艦全數開工且高度吸金，朝野立委天天在立法院為了預算審查拍桌互罵，媒體政論節目連續一週都在吵你的備料進度。";
    egg.style.display = "block";
  } else if (drone === 0) {
    egg.innerHTML = "⚠️ <b>【無視不對稱戰力】</b>：你一毛錢都不給本土無人機！網路輿論正群起圍攻，質疑你缺乏現代科技作戰思維。敵方正準備用低成本的無人機海飽和突擊你的常規防線。";
    egg.style.display = "block";
  }

  $("configLine").textContent = `配置方案：潛艦 ${sub}% ｜ 無人機 ${drone}% ｜ 美軍購 ${us}% ｜ 總額 ${fmt(TOTAL_BUDGET)} 億`;

  // 格式化分享文字
  currentShareText = `【2026 台灣防衛韌性體檢報告】\n\n🛡️ 綜合防衛防衛指數：${overall} / 100 [評級 ${gr.g} · ${gr.t}]\n🔱 海域拒止：${sea}\n🦅 空中縱深：${air}\n🛸 不對稱戰力：${asym}\n🔋 作戰韌性：${sustain}\n\n我的預算決策：潛艦 ${sub}% ｜ 無人機 ${drone}% ｜ 美軍購 ${us}%\n測試你的配置會觸發什麼政戰彩蛋評語！\n#國防預算模擬器`;

  $("report").style.display = "block";
  $("report").scrollIntoView({ behavior:"smooth", block:"start" });
}

function copyResult() {
  if (!currentShareText) return;
  navigator.clipboard.writeText(currentShareText).then(() => {
    alert('體檢報告已複製到剪貼簿！快去 Threads 或 PTT 貼上分享吧 🚀');
  }).catch(() => {
    alert('瀏覽器拒絕複製，請直接截圖分享～');
  });
}

function reset(){
  alloc = { sub:34, drone:33, us:33 };
  CATS.forEach(c => { $("slider-"+c.id).value = String(alloc[c.id]); });
  render();
  $("report").style.display = "none";
  window.scrollTo({ top:0, behavior:"smooth" });
}

$("totalBudget").textContent = fmt(TOTAL_BUDGET);
$("runBtn").addEventListener("click", runReport);
$("resetBtn").addEventListener("click", reset);
$("shareBtn").addEventListener("click", copyResult);
buildRows();
render();
</script>
</body>
</html>
]
