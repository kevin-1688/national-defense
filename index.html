<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國防預算模擬器 - 台灣防衛力體檢</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(to bottom, #001f3f, #003366);
            color: #fff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        h1 { color: #00ffff; text-shadow: 0 0 10px #00ffff; }
        .budget-info { font-size: 1.5em; margin: 20px 0; color: #ffd700; }
        .allocation { display: flex; flex-direction: column; gap: 20px; margin: 30px 0; }
        .category {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
        }
        .category label { flex: 1; text-align: left; font-weight: bold; }
        input[type="range"] { flex: 2; margin: 0 15px; }
        .value { width: 120px; text-align: right; font-size: 1.2em; color: #00ff00; }
        button {
            background: #ff4500;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            border-radius: 10px;
            cursor: pointer;
            margin: 20px;
            transition: all 0.3s;
        }
        button:hover { background: #ff6500; transform: scale(1.05); }
        #results {
            display: none;
            margin-top: 30px;
            text-align: left;
            background: rgba(0,0,0,0.8);
            padding: 25px;
            border-radius: 10px;
            border: 2px solid #00ffff;
        }
        .score-bar {
            height: 20px;
            background: #333;
            margin: 10px 0;
            border-radius: 5px;
            overflow: hidden;
        }
        .score-fill {
            height: 100%;
            background: linear-gradient(to right, #00ff00, #ffff00);
            text-align: right;
            padding-right: 10px;
            color: #000;
            font-weight: bold;
        }
        .emoji { font-size: 2em; }
        footer { margin-top: 40px; font-size: 0.9em; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ 國防預算模擬器</h1>
        <p style="font-size: 1.2em;">台灣 2026 特別預算模擬 - 你來決定如何守護台灣！</p>
        
        <div class="budget-info">
            可用預算：<span id="totalBudget">5000</span> 億新台幣
        </div>
        
        <div class="allocation">
            <div class="category">
                <label>🔱 潛艦後續艦 (國造潛艇)</label>
                <input type="range" id="sub" min="0" max="100" value="30" oninput="updateValues()">
                <span class="value" id="subVal">30%</span>
            </div>
            <div class="category">
                <label>🚁 本土無人機 (Drone 國家隊)</label>
                <input type="range" id="drone" min="0" max="100" value="35" oninput="updateValues()">
                <span class="value" id="droneVal">35%</span>
            </div>
            <div class="category">
                <label>🇺🇸 美軍裝備 (HIMARS, Javelin 等)</label>
                <input type="range" id="us" min="0" max="100" value="35" oninput="updateValues()">
                <span class="value" id="usVal">35%</span>
            </div>
        </div>
        
        <div style="margin: 20px 0; font-size: 1.1em;">
            已分配: <span id="allocated" style="color:#ffd700; font-weight:bold;">100</span>% 
            <span id="remaining" style="color:#ff0000;"></span>
        </div>
        
        <button onclick="generateReport()">🚀 生成防衛力體檢報告</button>
        
        <div id="results">
            <h2>📋 你的台灣防衛力體檢報告</h2>
            <div id="reportContent"></div>
            <button onclick="resetGame()" style="background:#00bfff;">🔄 重新分配預算</button>
        </div>
        
        <footer>
            純娛樂模擬遊戲｜參考真實國防議題｜在 PTT / Threads 分享你的報告吧！<br>
            平衡分配通常有最佳防衛力喔～
        </footer>
    </div>

    <script>
        function updateValues() {
            const sub = parseInt(document.getElementById('sub').value);
            const drone = parseInt(document.getElementById('drone').value);
            const us = parseInt(document.getElementById('us').value);
            
            document.getElementById('subVal').textContent = sub + '%';
            document.getElementById('droneVal').textContent = drone + '%';
            document.getElementById('usVal').textContent = us + '%';
            
            const totalAllocated = sub + drone + us;
            document.getElementById('allocated').textContent = totalAllocated;
            
            const remaining = 100 - totalAllocated;
            const remEl = document.getElementById('remaining');
            if (remaining > 0) {
                remEl.textContent = '(剩餘 ' + remaining + '%)';
            } else if (remaining < 0) {
                remEl.textContent = '(超支 ' + Math.abs(remaining) + '%)';
            } else {
                remEl.textContent = '';
            }
        }
        
        function generateReport() {
            const sub = parseInt(document.getElementById('sub').value);
            const drone = parseInt(document.getElementById('drone').value);
            const us = parseInt(document.getElementById('us').value);
            const total = sub + drone + us;
            
            if (Math.abs(total - 100) > 5) {
                alert('請將預算分配至 100% 左右！');
                return;
            }
            
            const seaScore = Math.min(95, Math.floor(sub * 1.2 + drone * 0.4 + us * 0.8));
            const airScore = Math.min(95, Math.floor(us * 1.3 + drone * 0.9 + sub * 0.3));
            const asymScore = Math.min(95, Math.floor(drone * 1.4 + us * 0.7 + sub * 0.5));
            const sustainScore = Math.min(90, Math.floor((sub + drone + us) / 3 * 0.9 + 20));
            
            const overall = Math.floor((seaScore + airScore + asymScore + sustainScore) / 4);
            
            let feedback = '';
            if (overall > 80) {
                feedback = '🇹🇼 優秀！你的分配展現戰略智慧，台灣有機會打出一場漂亮的不對稱防衛戰！';
            } else if (overall > 60) {
                feedback = '🟡 尚可。需要再優化，潛艦與無人機的平衡很重要。';
            } else {
                feedback = '⚠️ 需加強！過度依賴單一項目可能導致防線漏洞。';
            }
            
            let reportHTML = `
                <p><strong>整體防衛指數：</strong> ${overall}/100 <span class="emoji">${overall > 75 ? '🟢' : overall > 50 ? '🟡' : '🔴'}</span></p>
                <div>
                    <strong>海域控制力 (潛艦貢獻高)</strong>: ${seaScore}/100
                    <div class="score-bar"><div class="score-fill" style="width: ${seaScore}%">${seaScore}%</div></div>
                </div>
                <div>
                    <strong>空中防禦力 (美軍裝備強)</strong>: ${airScore}/100
                    <div class="score-bar"><div class="score-fill" style="width: ${airScore}%">${airScore}%</div></div>
                </div>
                <div>
                    <strong>不對稱戰力 (本土無人機王道)</strong>: ${asymScore}/100
                    <div class="score-bar"><div class="score-fill" style="width: ${asymScore}%">${asymScore}%</div></div>
                </div>
                <div>
                    <strong>持續作戰力</strong>: ${sustainScore}/100
                    <div class="score-bar"><div class="score-fill" style="width: ${sustainScore}%">${sustainScore}%</div></div>
                </div>
                <p style="margin-top:20px; font-size:1.2em;">${feedback}</p>
                <p style="font-style:italic; margin-top:25px;">
                    模擬結果純屬娛樂，現實國防需專業評估與跨黨派共識。<br>
                    你的配置：潛艦 ${sub}% ｜ 無人機 ${drone}% ｜ 美軍 ${us}%
                </p>
            `;
            
            document.getElementById('reportContent').innerHTML = reportHTML;
            document.getElementById('results').style.display = 'block';
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }
        
        function resetGame() {
            document.getElementById('results').style.display = 'none';
            document.getElementById('sub').value = 30;
            document.getElementById('drone').value = 35;
            document.getElementById('us').value = 35;
            updateValues();
        }
        
        window.onload = updateValues;
    </script>
</body>
</html>
